<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'BC';src:url('fuentes/bc-bold.woff2') format('woff2');font-weight:700}
*{margin:0;box-sizing:border-box}
body{width:851px;height:315px;background:#0D0F12;font-family:'BC',sans-serif;overflow:hidden;position:relative;display:flex;align-items:center}
.linea{position:absolute;height:2px;background:linear-gradient(90deg,transparent,#3FB4EF55,#FF6B1A66,transparent);width:130%}
.l1{top:44px;left:-80px;transform:rotate(-2deg)}
.l2{bottom:40px;right:-90px;transform:rotate(-2deg)}
.cuadros{position:absolute;top:24px;right:-30px;width:180px;height:32px;background:conic-gradient(#fff 0 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/16px 16px;opacity:.13;transform:skewX(-18deg)}
.izq{margin-left:56px}
.marca{font-size:74px;font-style:italic;font-weight:700;line-height:.9;color:#F4F6F8;text-transform:uppercase}
.marca b{color:#FF6B1A}
.sub{margin-top:10px;font-size:19px;letter-spacing:.28em;color:#B8E62E;text-transform:uppercase}
.pais{margin-top:6px;font-size:15px;letter-spacing:.16em;color:#A7B0BA;text-transform:uppercase}
.cta{margin-top:16px;display:inline-block;font-size:16px;color:#14100C;background:#FF6B1A;padding:8px 18px;border-radius:8px;letter-spacing:.05em;text-transform:uppercase}
.precios{margin-top:14px;font-size:24px;font-weight:700;color:#F4F6F8;letter-spacing:.02em}
.precios span{font-size:13px;color:#A7B0BA;letter-spacing:.1em;text-transform:uppercase;font-weight:400}
</style></head>
<body>
<div class="linea l1"></div><div class="linea l2"></div>
<div class="cuadros"></div>
<div class="izq">
  <div class="marca"><b>Nitro</b> Wash</div>
  <div class="sub">Mobile Detailing</div>
  <div class="pais">Bayamon · Puerto Rico</div>
  <div class="cta">Texto al (787) 547-9549</div>
  <div class="precios">Desde $70 · $150 · $250 &nbsp;<span>Al dia · A fondo · Blindado</span></div>
</div>
</body></html>
