<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'BC';src:url('fuentes/bc-bold.woff2') format('woff2');font-weight:700}
@font-face{font-family:'BC';src:url('fuentes/bc-semi.woff2') format('woff2');font-weight:600}
*{margin:0;box-sizing:border-box}
/* 1080x1350: el formato que el muro de Facebook e Instagram pintan mas grande */
body{width:1080px;height:1350px;background:#0D0F12;font-family:'BC',sans-serif;overflow:hidden;position:relative;
  display:flex;flex-direction:column;justify-content:space-between;padding:78px 72px 68px}
.linea{position:absolute;height:5px;width:150%;left:-25%;background:linear-gradient(90deg,transparent,#06ADFD55,#FD6F0D77,transparent);transform:rotate(-4deg)}
.l1{top:300px}
.l2{bottom:330px}
.cuadros{position:absolute;top:-20px;right:-40px;width:520px;height:74px;background:conic-gradient(#fff 0 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/37px 37px;opacity:.12;transform:skewX(-18deg)}
.marca{font-size:104px;font-style:italic;font-weight:700;line-height:.9;color:#F4F6F8;text-transform:uppercase}
.marca b{color:#FD6F0D}
.sub{margin-top:16px;font-size:27px;letter-spacing:.3em;color:#CBFF2E;text-transform:uppercase}
.centro{position:relative}
.abre{font-size:82px;font-style:italic;font-weight:700;line-height:1.02;color:#F4F6F8;text-transform:uppercase}
.abre em{font-style:italic;color:#FD6F0D}
.dice{margin-top:30px;font-family:'BC',sans-serif;font-weight:600;font-size:35px;line-height:1.45;color:#A7B0BA;max-width:830px}
.dice s{text-decoration:none;color:#F4F6F8}
.pueblos{margin-top:44px;display:flex;flex-wrap:wrap;gap:14px}
.chip{border:2px solid #6E7883;border-radius:999px;padding:13px 26px;font-size:26px;letter-spacing:.1em;color:#F4F6F8;text-transform:uppercase}
.pie{position:relative}
.precio{font-size:44px;font-weight:700;color:#F4F6F8}
.precio span{font-size:26px;color:#A7B0BA;letter-spacing:.08em;text-transform:uppercase;font-weight:400}
.cta{margin-top:26px;display:inline-block;font-size:40px;color:#14100C;background:#FD6F0D;padding:24px 42px;border-radius:16px;letter-spacing:.03em;text-transform:uppercase}
</style></head>
<body>
  <div class="linea l1"></div><div class="linea l2"></div>
  <div class="cuadros"></div>
  <div>
    <div class="marca"><b>Nitro</b> Wash</div>
    <div class="sub">Mobile Detailing</div>
  </div>
  <div class="centro">
    <div class="abre">Abrimos<br><em>en Bayamón</em></div>
    <div class="dice">El detalle del carro llega a donde <s>tú estás</s>: tu casa, tu trabajo o tu condominio. Llevamos agua y corriente propias.</div>
    <div class="pueblos">
      <span class="chip">Bayamón</span><span class="chip">Guaynabo</span><span class="chip">San Juan</span><span class="chip">Dorado</span>
    </div>
  </div>
  <div class="pie">
    <div class="precio">Al día desde $70 &nbsp;<span>el precio firme depende del carro</span></div>
    <div class="cta">Texto al (787) 547-9549</div>
  </div>
</body></html>
