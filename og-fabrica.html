<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'BC';src:url('fuentes/bc-bold.woff2') format('woff2');font-weight:700}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0D0F12;font-family:'BC',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.linea{position:absolute;height:3px;background:linear-gradient(90deg,transparent,#06ADFD55 30%,#FD6F0D66 70%,transparent);width:140%}
.l1{top:96px;left:-100px;transform:rotate(-2deg)}
.l2{bottom:88px;right:-120px;transform:rotate(-2deg)}
.cuadros{position:absolute;top:52px;right:-40px;width:220px;height:44px;background:
 conic-gradient(#fff 0 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/22px 22px;opacity:.14;transform:skewX(-18deg)}
.cuadros2{position:absolute;bottom:60px;left:-60px;width:260px;height:36px;background:
 conic-gradient(#fff 0 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/18px 18px;opacity:.10;transform:skewX(-18deg)}
.centro{text-align:center}
.marca{font-size:150px;font-style:italic;font-weight:700;line-height:.9;letter-spacing:.01em;color:#F4F6F8;text-transform:uppercase}
.marca b{color:#FD6F0D}
.sub{margin-top:26px;font-size:34px;letter-spacing:.32em;color:#CBFF2E;text-transform:uppercase}
.pais{margin-top:12px;font-size:24px;letter-spacing:.2em;color:#A7B0BA;text-transform:uppercase}
.cta{margin-top:38px;display:inline-block;font-size:26px;color:#14100C;background:#FD6F0D;padding:14px 34px;border-radius:10px;letter-spacing:.06em;text-transform:uppercase}
</style></head>
<body>
<div class="linea l1"></div><div class="linea l2"></div>
<div class="cuadros"></div><div class="cuadros2"></div>
<div class="centro">
  <div class="marca"><b>Nitro</b> Wash</div>
  <div class="sub">Mobile Detailing</div>
  <div class="pais">Puerto Rico · A domicilio</div>
  <div class="cta">Texto al (787) 547-9549</div>
</div>
</body></html>
